<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="850" cy="380" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="200" cy="420" r="60" fill="rgba(255,255,255,0.06)"/>
  
  <!-- App Logo/Icon -->
  <circle cx="150" cy="250" r="60" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="150" y="265" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">💬</text>
  
  <!-- Title -->
  <text x="320" y="220" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#text-gradient)" text-anchor="start">InnerCircle</text>
  
  <!-- Subtitle -->
  <text x="320" y="280" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="start">Your AI Companion Circle</text>
  
  <!-- Feature tags -->
  <g font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.85)">
    <text x="320" y="330" text-anchor="start">💬 4 Unique Personas</text>
    <text x="320" y="365" text-anchor="start">🧠 Long-term Memory</text>
    <text x="320" y="400" text-anchor="start">🎭 Adaptive Personalities</text>
    <text x="320" y="435" text-anchor="start">🔔 Smart Check-ins</text>
  </g>
  
  <!-- Bottom accent -->
  <rect x="320" y="460" width="200" height="4" fill="rgba(255,255,255,0.3)" rx="2"/>
</svg>