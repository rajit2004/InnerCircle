    <rect x="30" y="1100" width="1020" height="200" rx="20" fill="url(#card)" stroke="#6366f1" stroke-dasharray="10,10" stroke-width="2"/>
    <circle cx="540" cy="1150" r="35" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="2"/>
