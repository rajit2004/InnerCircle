<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e3e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1920" fill="url(#bg)"/>
  
  <!-- Status bar -->
  <rect x="0" y="0" width="1080" height="60" fill="#0f0f1a"/>
  <text x="540" y="40" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">9:41</text>
  <text x="980" y="40" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="end">🔋 87%</text>
  
  <!-- App bar -->
  <rect x="0" y="60" width="1080" height="100" fill="#1a1a2e"/>
  <text x="540" y="110" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">Profile</text>
  
  <!-- Profile header -->
  <rect x="30" y="200" width="1020" height="300" rx="20" fill="url(#card)"/>
  <circle cx="540" cy="280" r="70" fill="url(#icon-gradient)"/>
  <text x="540" y="290" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle">💬</text>
  <text x="540" y="380" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Alex Chen</text>
  <text x="540" y="420" font-family="Arial, sans-serif" font-size="18" fill="#aaa" text-anchor="middle">@alexchen • alex@email.com</text>
  <text x="540" y="460" font-family="Arial, sans-serif" font-size="16" fill="#6366f1" text-anchor="middle" font-weight="bold">Premium</text>
  
  <!-- Stats -->
  <rect x="60" y="540" width="300" height="120" rx="16" fill="url(#card)"/>
  <text x="210" y="585" font-family="Arial, sans-serif" font-size="16" fill="#aaa" text-anchor="middle">Conversations</text>
  <text x="210" y="625" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">127</text>
  
  <rect x="390" y="540" width="300" height="120" rx="16" fill="url(#card)"/>
  <text x="540" y="585" font-family="Arial, sans-serif" font-size="16" fill="#aaa" text-anchor="middle">Messages</text>
  <text x="540" y="625" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">2,847</text>
  
  <rect x="720" y="540" width="300" height="120" rx="16" fill="url(#card)"/>
  <text x="870" y="585" font-family="Arial, sans-serif" font-size="16" fill="#aaa" text-anchor="middle">Memories</text>
  <text x="870" y="625" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">43</text>
  
  <!-- Settings list -->
  <g font-family="Arial, sans-serif" font-size="20" fill="white">
    <rect x="30" y="700" width="1020" height="80" rx="16" fill="url(#card)"/>
    <text x="60" y="745" fill="#6366f1">🌙</text>
    <text x="120" y="745">Dark Mode</text>
    <text x="900" y="745" fill="#aaa">On</text>
    
    <rect x="30" y="810" width="1020" height="80" rx="16" fill="url(#card)"/>
    <text x="60" y="855" fill="#8b5cf6">💬</text>
    <text x="120" y="855">Communication Style</text>
    <text x="900" y="855" fill="#aaa">Casual</text>
    
    <rect x="30" y="920" width="1020" height="80" rx="16" fill="url(#card)"/>
    <text x="60" y="965" fill="#ec4899">🧠</text>
    <text x="120" y="965">Memory</text>
    <text x="900" y="965" fill="#aaa">Enabled</text>
    
    <rect x="30" y="1030" width="1020" height="80" rx="16" fill="url(#card)"/>
    <text x="60" y="1075" fill="#ec4899">🔔</text>
    <text x="120" y="1075">Check-in Reminders</text>
    <text x="900" y="1075" fill="#aaa">3 scheduled</text>
    
    <rect x="30" y="1140" width="1020" height="80" rx="16" fill="url(#card)"/>
    <text x="60" y="1185" fill="#6366f1">💎</text>
    <text x="120" y="1185">Subscription</text>
    <text x="900" y="1185" fill="#6366f1" font-weight="bold">Premium</text>
    
    <rect x="30" y="1250" width="1020" height="80" rx="16" fill="url(#card)"/>
    <text x="60" y="1295" fill="#ec4899">🔒</text>
    <text x="120" y="1295">Privacy & Security</text>
    <text x="900" y="1295" fill="#aaa">Manage</text>
  </g>
  
  <!-- Nav bar -->
  <rect x="0" y="1880" width="1080" height="40" fill="#0f0f1a"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#6366f1">
    <text x="150" y="1905" text-anchor="middle">🏠</text>
    <text x="360" y="1905" text-anchor="middle">💬</text>
    <text x="540" y="1905" text-anchor="middle">➕</text>
    <text x="720" y="1905" text-anchor="middle">🔔</text>
    <text x="930" y="1905" text-anchor="middle">👤</text>
  </g>
</svg>