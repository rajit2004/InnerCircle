server:
  port: 8080

spring:
  application:
    name: innercircle-backend
  servlet:
    multipart:
      # Matches UserController.MAX_AVATAR_SIZE (5MB) — previously capped at 2MB
      # here while the controller claimed 5MB, so uploads 2-5MB were rejected
      # with a 500 before reaching the size check.
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    # BUG FIX (Round 6): Added ?characterEncoding=UTF-8&useUnicode=true to the JDBC
    # URL. Without an explicit encoding, the PostgreSQL JDBC driver negotiates
    # client_encoding based on locale/OS defaults, which on some Windows setups
    # silently falls back to something other than UTF-8. This is the actual root
    # cause of the persona avatar_emoji mojibake (e.g. "ð  ©â  ð  §" instead of
    # "👩‍👧") seen in test output — multi-byte emoji characters were being
    # mis-decoded on the wire between the app and Postgres. Forcing UTF-8 here
    # prevents this from recurring even if schema.sql is reapplied later.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/innercircle?characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # PERFORMANCE: HikariCP pool tuning. Defaults are conservative
      # (max=10, idle=10, maxLifetime=30min). These values balance a
      # single-instance deployment (~50 concurrent users) against the
      # risk of leaking connections when a Groq .block() holds one for
      # up to 30s inside a @Transactional.
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Connections idle longer than this are recycled. Lower than the
      # default 10min so dead connections are reaped before a user
      # notices a timeout.
      idle-timeout: 300000
      # Hard cap on connection age — forces rotation so we never hold a
      # connection that PostgreSQL has silently closed.
      max-lifetime: 600000
      # Fail fast if the DB is unreachable at startup instead of
      # hanging the boot sequence on the driver default (30s).
      connection-timeout: 5000
      # Test connection validity before handing it to a thread —
      # cheap SELECT 1 prevents "connection is not open" errors after
      # a network blip.
      connection-test-query: SELECT 1
      pool-name: InnerCirclePool
  sql:
    init:
      mode: always
      schema-locations: file:../database/schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    # BUG FIX: Removed explicit hibernate.dialect — Hibernate 6+ auto-detects PostgreSQL
    # dialect. Specifying it explicitly triggers a deprecation WARN on every startup:
    # "HHH90000025: PostgreSQLDialect does not need to be specified explicitly"

groq:
  # BUG: this was hardcoded to the literal string "my-api-key", which silently
  # ignored any $GROQ_API_KEY you set in the shell -- every Groq call would
  # have failed with an auth error regardless of your env var. Fixed back to
  # reading from the environment.
  api-key: ${GROQ_API_KEY:your-groq-key}
  # llama-3.1-8b-instant was announced for deprecation by Groq on 2026-06-17 --
  # it may already be unstable or removed. openai/gpt-oss-120b is Groq's
  # current recommended replacement model as of this fix.
  model: openai/gpt-oss-120b
  url: https://api.groq.com/openai/v1/chat/completions

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
  expiration: 86400000        # 24 hours
  # SECURITY: fail closed by default — refuse to start with the placeholder secret.
  # Local dev: set JWT_SECRET to any long random string, or set JWT_REQUIRE_SECRET=false.
  require-secret: ${JWT_REQUIRE_SECRET:true}

subscription:
  # SECURITY: self-serve tier changes are disabled by default — anyone could
  # otherwise POST /api/users/subscription {tier:"premium"} with no payment.
  # Set SUBSCRIPTION_SELF_SERVE=true locally only while testing the upgrade UI
  # without a real payment gateway. Production must keep this false until
  # server-side purchase verification exists.
  self-serve: ${SUBSCRIPTION_SELF_SERVE:false}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/settings?success=true}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/settings?canceled=true}
  premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}

firebase:
  # Path to a Firebase service-account JSON file. Leave unset to run without
  # real push delivery -- NotificationService will log instead of sending.
  credentials-path: ${FCM_CREDENTIALS_PATH:}

cors:
  # SECURITY: removed hardcoded personal LAN IP (10.76.238.34) from the default —
  # it leaked a private address into the repo and is wrong for every other machine.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://10.0.2.2:8080}

logging:
  # SECURITY: DEBUG on org.springframework.security logs every auth
  # decision and header — useful in dev, noisy and potentially leaky in
  # prod. WARN is the right default; set DEBUG via LOG_LEVEL_SECURITY env
  # only when actively debugging an auth issue.
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    com.innercircle: ${LOG_LEVEL_APP:INFO}
  # STRUCTURED LOGGING: ECS (Elastic Common Schema) single-line JSON on
  # console — every line carries timestamp, level, logger, message, and
  # the MDC request correlation ID. Works with Loki/ELK/Datadog out of
  # the box. Set LOG_FORMAT=plain for human-readable dev output.
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99